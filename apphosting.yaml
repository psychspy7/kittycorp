# Cloud Run service configuration for Firebase App Hosting
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

# Environment variables for build and runtime
env:
  - variable: NEXT_TELEMETRY_DISABLED
    value: "1"
    availability:
      - BUILD
      - RUNTIME
  - variable: SITE_URL
    value: "https://thekittycorp.com"
    availability:
      - BUILD
      - RUNTIME
